<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SRT 2 Kota Pasuruan</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between">
        <!-- Dynamic Content Area -->
        <div id="main-view" class="p-6 flex-1 flex flex-col justify-center">
            <!-- Default Welcome Screen -->
            <div id="view-welcome" class="text-center space-y-6">
                <img src="https://via.placeholder.com/100" alt="Logo Sekolah" class="mx-auto rounded-full shadow-md">
                <h1 class="text-2xl font-bold text-blue-900">Selamat datang di portal SRT 2 Kota Pasuruan</h1>
                <p class="text-xs text-slate-500 italic">"Cerdas Bersama, Tumbuh Setara"</p>
                <button onclick="showLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition">Login</button>
            </div>

            <!-- Login View -->
            <div id="view-login" class="hidden space-y-4">
                <div class="text-center">
                    <img src="https://via.placeholder.com/80" alt="Logo" class="mx-auto">
                    <h2 class="text-xl font-bold mt-2">Masuk Portal</h2>
                </div>
                <div class="space-y-3">
                    <input type="text" id="login-id" placeholder="NIP / NISN / NIW / QR Data" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="password" id="login-pass" placeholder="Password (Khusus Admin)" class="w-full px-4 py-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="processLogin()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl">Masuk</button>
                    <button onclick="startQRScanner()" class="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl">Scan QR</button>
                </div>
                <div id="qr-reader" class="w-full mt-4"></div>
            </div>

            <!-- Dashboard Admin View (Mockup container) -->
            <div id="view-admin" class="hidden space-y-4">
                <h2 class="text-xl font-bold text-blue-900">Dasbor Admin</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-4 bg-blue-50 rounded-xl shadow-sm"><h3 class="text-sm font-semibold">Siswa Tidak Hadir</h3><p class="text-2xl font-bold text-blue-600" id="stat-alpha">0</p></div>
                    <div class="p-4 bg-emerald-50 rounded-xl shadow-sm"><h3 class="text-sm font-semibold">Peminjaman</h3><p class="text-2xl font-bold text-emerald-600" id="stat-loan">0</p></div>
                </div>
                <button onclick="logout()" class="w-full bg-red-500 text-white py-2 rounded-xl mt-6">Keluar</button>
            </div>

            <!-- Dashboard Orang Tua View -->
            <div id="view-parent" class="hidden space-y-4">
                <h2 class="text-xl font-bold text-blue-900">Portal Orang Tua</h2>
                <div class="p-4 bg-amber-50 rounded-xl border border-amber-200">
                    <h3 class="font-bold text-amber-900">Pengumuman Terbaru</h3>
                    <p class="text-sm text-amber-800" id="parent-announcement">Memuat pengumuman...</p>
                </div>
                <button onclick="logout()" class="w-full bg-red-500 text-white py-2 rounded-xl mt-6">Keluar</button>
            </div>
        </div>

        <footer class="p-4 text-center text-xs text-slate-400 border-t">
            SRT 2 Kota Pasuruan &copy; 2026
        </footer>
    </div>

    <script>
        function showLogin() {
            document.getElementById('view-welcome').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
        }

        function processLogin() {
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;
            
            google.script.run.withSuccessHandler(res => {
                if(res.success) {
                    alert("Login Berhasil sebagai " + res.role);
                    if(res.role === 'Siswa' || res.role === 'Orang Tua') {
                        document.getElementById('view-login').classList.add('hidden');
                        document.getElementById('view-parent').classList.remove('hidden');
                    } else {
                        document.getElementById('view-login').classList.add('hidden');
                        document.getElementById('view-admin').classList.remove('hidden');
                    }
                } else {
                    alert(res.message);
                }
            }).apiLogin(id, pass);
        }

        function startQRScanner() {
            const html5QrCode = new Html5Qrcode("qr-reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                qrCodeMessage => {
                    document.getElementById('login-id').value = qrCodeMessage;
                    html5QrCode.stop();
                    processLogin();
                },
                errorMessage => {}
            ).catch(err => { console.error("Gagal membuka kamera", err); });
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
