<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Portal Sekolah Rakyat Kota Pasuruan</title>
<meta name="description" content="Portal digital Sekolah Rakyat Kota Pasuruan — Cerdas Bersama, Tumbuh Setara">
<meta name="theme-color" content="#0F5257">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div id="toast-wrap" class="toast-wrap"></div>

<!-- ============ WELCOME (belum login) ============ -->
<div id="view-welcome" class="welcome-screen hidden">
  <div class="crest-big">SR</div>
  <h1>Selamat datang di portal Sekolah Rakyat Kota Pasuruan</h1>
  <p class="tagline">Cerdas Bersama, Tumbuh Setara</p>
  <button class="btn btn-primary" id="btn-go-login">Masuk</button>
</div>

<!-- ============ LOGIN ============ -->
<div id="view-login" class="login-screen hidden">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
    <button class="btn btn-ghost btn-icon" id="btn-back-welcome" aria-label="Kembali">←</button>
    <div class="crest" style="background:var(--teal-800);color:#fff;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:Sora;font-weight:800">SR</div>
    <div>
      <b class="font-display" style="font-weight:700">Masuk</b><br>
      <span style="font-size:.78rem;color:var(--text-dim)">Sekolah Rakyat Kota Pasuruan</span>
    </div>
  </div>

  <div class="tabs">
    <button id="tab-password" class="active">NIP &amp; Password</button>
    <button id="tab-qr">Scan QR</button>
  </div>

  <div id="pane-password">
    <label for="in-nip">NIP</label>
    <input id="in-nip" type="text" placeholder="Masukkan NIP" inputmode="numeric">
    <label for="in-pass">Password</label>
    <input id="in-pass" type="password" placeholder="Masukkan password">
    <button class="btn btn-primary btn-block" style="margin-top:18px" id="btn-login-password">Masuk</button>
    <p style="font-size:.78rem;color:var(--text-dim);margin-top:10px">Khusus Pegawai Sekolah Rakyat</p>
  </div>

  <div id="pane-qr" class="hidden">
    <div class="qr-box" id="qr-reader-wrap">
      <div id="qr-reader" style="width:100%;height:100%"></div>
    </div>
    <div id="qr-error-box" class="hidden"></div>
    <p style="font-size:.78rem;color:var(--text-dim);margin-top:10px;text-align:center">Arahkan kamera ke kartu QR Anda.</p>
  </div>
</div>

<!-- ============ APP SHELL (sudah login) ============ -->
<div id="app" class="hidden">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="mainarea">
    <div class="topbar">
      <div class="crest">SR</div>
      <div class="titles">
        <b>Portal Sekolah Rakyat Kota Pasuruan</b><br>
        <span id="topbar-sub">Cerdas Bersama, Tumbuh Setara</span>
      </div>
      <span class="role-chip" id="role-chip">-</span>
      <button class="btn btn-ghost btn-icon" id="btn-theme" aria-label="Ganti tema">🌙</button>
    </div>
    <main class="content" id="content"></main>
  </div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<!-- ============ MODAL ROOT ============ -->
<div id="modal-root"></div>

<!-- ============ PRINT AREA ============ -->
<div id="print-area" class="print-only"></div>

<script src="app.js"></script>
</body>
</html>
